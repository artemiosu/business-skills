name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate repository and run skill evals
        run: python3 scripts/validate_repository.py
      - name: Smoke-test installation
        run: |
          target="$(mktemp -d)"
          python3 scripts/install.py --dest "$target"
          test -f "$target/horizon-scout/SKILL.md"
          test -f "$target/evidence-echo-forensics/SKILL.md"
          test -f "$target/autonomy-governor/SKILL.md"
          python3 scripts/install.py --dest "$target" --force
