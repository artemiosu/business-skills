name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate repository and run skill evals
        run: python3 scripts/validate_repository.py
      - name: Smoke-test installation
        run: |
          target="$(mktemp -d)"
          python3 scripts/install.py --dest "$target"
          test -f "$target/horizon-scout/SKILL.md"
          python3 scripts/install.py --dest "$target" --force
